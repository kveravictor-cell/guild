<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202127">
  <title>Guild — comunidades e conversas</title>
  <style>
    :root{color-scheme:dark;--bg:#202127;--rail:#17181d;--side:#292b31;--side2:#23252a;--line:#3a3c43;--text:#f2f3f5;--muted:#a0a5ae;--accent:#6875e8;--accent2:#7d88f3;--green:#43b581;--red:#ed626a;--hover:#36383f;--bubble:#303239;--shadow:#0006}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}button,input,textarea{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
    .app{height:100dvh;display:grid;grid-template-columns:70px 245px minmax(0,1fr) 235px}.rail{background:var(--rail);display:flex;align-items:center;flex-direction:column;gap:9px;padding:12px 0;overflow:auto}.server{width:48px;height:48px;flex:0 0 48px;border:0;border-radius:50%;background:#30323a;display:grid;place-items:center;font-size:16px;font-weight:800;cursor:pointer;position:relative;transition:.15s}.server:hover,.server.active{border-radius:17px;background:var(--accent)}.server.active:before{content:"";position:absolute;left:-11px;width:4px;height:31px;border-radius:0 4px 4px 0;background:white}.server.home{background:var(--accent)}.server.add{color:var(--green);font-size:25px;font-weight:400}.sep{width:31px;height:2px;background:#34363d;border-radius:3px;margin:1px 0}
    .sidebar{background:var(--side);min-width:0;display:flex;flex-direction:column}.sidehead{height:58px;flex:0 0 58px;padding:0 13px 0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #191a1d55;box-shadow:0 1px 2px #0002}.sidehead strong{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side-scroll{flex:1;overflow:auto;padding:12px 8px}.section-title{height:27px;display:flex;align-items:center;justify-content:space-between;padding:0 5px;margin:5px 0;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.04em}.section-title button{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}.row{border:0;background:transparent;border-radius:5px;width:100%;min-height:34px;padding:5px 8px;display:flex;align-items:center;gap:9px;color:var(--muted);text-align:left;cursor:pointer}.row:hover{background:var(--hover);color:#e4e5e8}.row.active{background:#3b3e46;color:white}.row .glyph{font-size:18px;color:#858b95;line-height:1;width:18px;text-align:center}.row .rowname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.count{font-size:10px;color:white;background:var(--red);border-radius:9px;padding:1px 6px}.voice-status{font-size:11px;color:var(--muted);padding:6px 10px 2px}.voice-status b{color:var(--green)}.voice-controls{display:flex;gap:6px;padding:0 7px 8px}.voice-controls button{flex:1;border:0;border-radius:5px;background:#25262c;color:var(--muted);padding:6px;cursor:pointer}.voice-controls button.on{color:white;background:#4a4d56}.profile{height:58px;background:var(--side2);display:flex;align-items:center;gap:8px;padding:7px 8px}.avatar{--av:#bf7c96;width:35px;height:35px;flex:0 0 35px;border-radius:50%;background:var(--av);display:grid;place-items:center;color:white;font-weight:800;position:relative}.online-dot{position:absolute;width:10px;height:10px;right:-1px;bottom:-1px;border-radius:50%;background:var(--green);border:2px solid var(--side2)}.profile-copy{min-width:0;flex:1}.profile-copy b,.profile-copy small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-copy b{font-size:12px}.profile-copy small{color:var(--muted);font-size:10px}.iconbtn{width:31px;height:31px;border:0;border-radius:6px;background:transparent;color:var(--muted);display:inline-grid;place-items:center;cursor:pointer;font-size:17px}.iconbtn:hover{background:var(--hover);color:white}
    .main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}.toolbar{height:58px;flex:0 0 58px;border-bottom:1px solid #17181b;box-shadow:0 1px 2px #0002;display:flex;align-items:center;gap:10px;padding:0 14px}.toolbar .title{font-weight:750;font-size:15px}.toolbar .desc{color:var(--muted);font-size:12px;border-left:1px solid var(--line);padding-left:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spacer{flex:1}.search{width:175px;height:30px;background:#17181d;border:0;border-radius:5px;color:var(--text);padding:0 9px;font-size:12px}.scrollarea{flex:1;min-height:0;overflow:auto;padding:20px max(20px,calc((100% - 900px)/2)) 12px}.welcome{border-bottom:1px solid var(--line);padding-bottom:18px;margin:0 0 16px}.welcome .big-hash{width:58px;height:58px;border-radius:50%;background:#34363e;display:grid;place-items:center;font-size:27px;margin-bottom:12px}.welcome h1{margin:0 0 4px;font-size:24px;letter-spacing:-.025em}.welcome p{margin:0;color:var(--muted)}.date-line{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:10px;font-weight:800;margin:15px 0}.date-line:before,.date-line:after{content:"";height:1px;background:var(--line);flex:1}.msg{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:7px 8px;margin:0 -8px;border-radius:5px}.msg:hover{background:#25262b}.msg .avatar{width:38px;height:38px}.msg .body{min-width:0}.meta{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}.meta b{font-size:14px}.meta time{font-size:10px;color:var(--muted)}.msg p{margin:0;color:#dbdde1;white-space:pre-wrap;overflow-wrap:anywhere}.replyref{font-size:11px;color:var(--muted);margin:0 0 3px 3px;padding-left:9px;border-left:2px solid #656bdb}.msg-actions{display:none;position:absolute;right:7px;top:-12px;background:var(--side);border:1px solid #17181d;border-radius:6px;box-shadow:0 3px 8px var(--shadow)}.msg:hover .msg-actions{display:flex}.msg-actions button{border:0;background:transparent;color:var(--muted);padding:5px 7px;cursor:pointer}.msg-actions button:hover{color:white}.reactions{display:flex;gap:5px;margin-top:5px}.reaction{border:1px solid #4b4e59;border-radius:10px;background:#292b31;color:#d6d8df;padding:1px 7px;font-size:11px;cursor:pointer}.reaction:hover,.reaction.selected{border-color:var(--accent);background:#373a56}.composer-area{padding:8px max(14px,calc((100% - 912px)/2)) 17px}.reply-banner,.attachment-banner{display:none;align-items:center;gap:8px;color:var(--muted);font-size:11px;padding:6px 10px;background:#292b31;border-radius:6px 6px 0 0}.reply-banner.show,.attachment-banner.show{display:flex}.reply-banner button,.attachment-banner button{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer}.composer{min-height:48px;border-radius:8px;background:#383a42;display:flex;align-items:center;gap:7px;padding:0 9px}.composer.replying{border-radius:0 0 8px 8px}.composer input{flex:1;min-width:0;height:46px;background:transparent;color:var(--text);border:0;outline:0}.composer input::placeholder{color:#a5a8b0}.send{border:0;border-radius:6px;background:var(--accent);color:white;padding:7px 11px;font-weight:700;cursor:pointer}.send:hover{background:var(--accent2)}
    .members{background:var(--side2);padding:16px 10px;overflow:auto}.members h2{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:3px 6px 8px}.member{width:100%;display:flex;align-items:center;gap:8px;padding:6px;border-radius:5px;color:#c9cbd1}.member:hover{background:#2d2f35}.member .avatar{width:30px;height:30px;flex-basis:30px;font-size:11px}.member span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.offline{opacity:.42}.friend-card{background:var(--side);border-radius:8px;padding:18px;margin:8px 0}.friend-card h2{margin:0 0 4px}.friend-card p{color:var(--muted);margin:0}.friend-tools{display:flex;gap:8px;margin:14px 0}.primary,.secondary{border:0;border-radius:5px;padding:8px 12px;font-weight:650;cursor:pointer}.primary{background:var(--green);color:#101813}.secondary{background:#3a3d45;color:#e8e9ec}.friend-item{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}.friend-item .name{flex:1}.friend-item small{display:block;color:var(--muted)}.voice-screen{height:100%;display:grid;place-items:center;text-align:center}.voice-screen .voice-orb{width:112px;height:112px;background:#343745;border:7px solid #4b4f67;border-radius:50%;display:grid;place-items:center;font-size:42px;margin:0 auto 18px}.voice-screen h1{margin:0 0 4px}.voice-screen p{margin:0;color:var(--muted)}.voice-buttons{display:flex;justify-content:center;gap:10px;margin-top:25px}.voice-buttons button{border:0;border-radius:50%;width:48px;height:48px;background:#3b3e47;cursor:pointer;font-size:18px}.voice-buttons button.leave{background:var(--red)}.empty{color:var(--muted);text-align:center;padding:35px}.modal-backdrop{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:#292b31;border-radius:10px;width:min(440px,100%);padding:22px;box-shadow:0 12px 50px #0008}.modal h2{margin:0 0 5px}.modal p{color:var(--muted);margin:0 0 16px}.modal input,.modal select{width:100%;background:#1f2025;border:1px solid #444750;border-radius:5px;color:white;padding:10px;margin:5px 0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.modal .close{float:right}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;pointer-events:none;z-index:20;background:#111214;color:white;border-radius:7px;padding:10px 15px;box-shadow:0 6px 22px #0006;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.light{--bg:#f2f3f5;--rail:#e4e5e9;--side:#fff;--side2:#f7f7f9;--line:#d5d7dc;--text:#24252b;--muted:#70747d;--hover:#e8e9ed;--bubble:#f5f5f7}.light .msg p{color:#383a40}.light .composer{background:#e5e6ea}.light .search{background:#e3e4e8;color:#24252b}.light .profile{background:#edeef1}
    @media(max-width:1000px){.app{grid-template-columns:64px 220px minmax(0,1fr)}.members{display:none}}@media(max-width:650px){.app{grid-template-columns:56px minmax(0,1fr)}.sidebar{display:none}.toolbar{padding:0 9px}.toolbar .desc{display:none}.search{width:108px}.scrollarea{padding:14px 12px}.composer-area{padding:6px 9px 10px}.toolbar .title{font-size:14px}}
    body:not(.authenticated) #app{display:none}.auth-screen{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 20%,#34374c,#202127 60%)}.auth-card{width:min(420px,100%);background:#292b31;border:1px solid #3a3c43;border-radius:12px;padding:28px;box-shadow:0 18px 60px #0007}.auth-card h1{margin:0 0 6px;font-size:25px}.auth-card p{margin:0 0 20px;color:#a0a5ae}.auth-card label{display:block;color:#c9cbd1;font-size:12px;font-weight:700;margin:12px 0 5px}.auth-card input{width:100%;height:42px;padding:0 11px;background:#1f2025;color:#f2f3f5;border:1px solid #444750;border-radius:6px}.auth-card .send{width:100%;height:42px;margin-top:18px}.auth-switch{width:100%;border:0;background:transparent;color:#abb3ff;margin-top:12px;cursor:pointer}.auth-error{min-height:18px;color:#ff8f96;font-size:12px;margin-top:10px}.auth-logout{border:0;border-radius:5px;background:#25262c;color:#c9cbd1;padding:7px 8px;cursor:pointer;font-size:11px}.auth-logout:hover{background:#3a3d45;color:white}
  </style>
</head>
<body>
  <section class="auth-screen" id="authScreen"><form class="auth-card" id="authForm"><h1>Entrar no Guild</h1><p>Crie uma conta para acessar suas conversas privadas.</p><label for="authUsername">Nome de usuário</label><input id="authUsername" name="username" autocomplete="username" minlength="3" maxlength="24" required><label for="authPassword">Senha</label><input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required><button class="send" type="submit">Entrar</button><button class="auth-switch" id="authSwitch" type="button">Primeira vez? Criar conta</button><div class="auth-error" id="authError" role="status"></div></form></section>
  <div class="app" id="app">
    <nav class="rail" id="rail" aria-label="Navegação principal"></nav>
    <aside class="sidebar"><header class="sidehead"><strong id="sideTitle">Nebulosa</strong><button class="iconbtn" data-action="server-menu" title="Opções da comunidade">⌄</button></header><div class="side-scroll" id="sideContent"></div><div id="voiceStatus"></div><footer class="profile"><div class="avatar" id="profileAvatar">V<span class="online-dot"></span></div><div class="profile-copy"><b id="profileName">vita</b><small id="profileStatus">online</small></div><button class="auth-logout" data-action="logout" title="Sair da conta">Sair</button><button class="iconbtn" data-action="profile" title="Editar perfil">✎</button><button class="iconbtn" data-action="settings" title="Configurações">⚙</button></footer></aside>
    <main class="main"><header class="toolbar"><span id="mainGlyph" class="glyph">#</span><span class="title" id="mainTitle">geral</span><span class="desc" id="mainDesc">Conversa com a comunidade</span><span class="spacer"></span><button class="iconbtn" data-action="invite" title="Convidar">♧</button><button class="iconbtn" data-action="members" title="Mostrar membros">♙</button><input class="search" id="search" placeholder="⌕ Buscar" aria-label="Buscar mensagens"></header><section class="scrollarea" id="mainContent"></section><div class="composer-area" id="composerArea"></div></main>
    <aside class="members" id="members"></aside>
  </div>
  <input type="file" id="filePicker" hidden multiple>
  <div id="modalRoot"></div><div class="toast" id="toast" role="status"></div>
  <script>
  (()=>{
    let KEY='guild-app-v1';
    const makeId=()=>Math.random().toString(36).slice(2,9);
    const seed=()=>({profile:{name:'vita',status:'online'},theme:'dark',activeServer:'neb',activeChannel:'general',view:'channel',activeDm:'lua',joinedVoice:null,muted:false,deafened:false,servers:[{id:'neb',name:'Nebulosa',icon:'N',categories:[{id:'info',name:'INFORMAÇÕES',channels:[{id:'welcome',name:'boas-vindas',type:'text',messages:[]},{id:'rules',name:'regras',type:'text',messages:[]}]},{id:'chat',name:'CONVERSAS',channels:[{id:'general',name:'geral',type:'text',messages:[{id:makeId(),name:'Lua',initial:'L',color:'#397e8a',time:'09:41',text:'Bom dia, pessoal! O que vocês estão criando hoje?',reactions:{'👋':2}},{id:makeId(),name:'mateus.dev',initial:'M',color:'#7658b4',time:'09:43',text:'Estou montando um protótipo novo. Vou compartilhar quando estiver pronto ✨',reactions:{'✨':1}},{id:makeId(),name:'ana',initial:'A',color:'#bc7c42',time:'09:46',text:'Que legal! Posso ajudar com os ícones se precisar.',reactions:{}}]},{id:'share',name:'compartilhe',type:'text',messages:[]},{id:'help',name:'ajuda',type:'text',messages:[]}]},{id:'voice',name:'VOZ',channels:[{id:'room',name:'Sala geral',type:'voice',messages:[]},{id:'music',name:'Música',type:'voice',messages:[]}]}],members:[{name:'Lua',initial:'L',color:'#397e8a',status:'online',role:'Moderadora'},{name:'mateus.dev',initial:'M',color:'#7658b4',status:'online',role:'Membro'},{name:'ana',initial:'A',color:'#bc7c42',status:'online',role:'Membro'},{name:'rafa',initial:'R',color:'#65758d',status:'offline',role:'Membro'}]}],friends:[{id:'lua',name:'Lua',initial:'L',color:'#397e8a',status:'online',messages:[{id:makeId(),name:'Lua',initial:'L',color:'#397e8a',time:'Ontem',text:'Depois me manda o link do projeto!'},{id:makeId(),name:'vita',initial:'V',color:'#bf7c96',time:'Ontem',text:'Mando sim 😊'}]},{id:'mateus',name:'mateus.dev',initial:'M',color:'#7658b4',status:'online',messages:[]},{id:'ana',name:'ana',initial:'A',color:'#bc7c42',status:'ausente',messages:[]}],pending:[],pins:[]});
    let data=seed();
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let replyId=null, files=[], filter='', collapsed=new Set();
    const server=()=>data.servers.find(x=>x.id===data.activeServer)||data.servers[0];
    const channel=()=>server()?.categories.flatMap(c=>c.channels).find(x=>x.id===data.activeChannel);
    const dm=()=>data.friends.find(x=>x.id===data.activeDm);
    const clientId=makeId();let backendReady=false,syncTimer=null;
    const save=(sync=true)=>{localStorage.setItem(KEY,JSON.stringify(data));if(!sync||!backendReady)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId,state:data})}).catch(()=>toast('Servidor local desconectado; alterações ficaram neste navegador.')),180)};
    const toast=msg=>{const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)};
    const avatar=(name,initial,color,online=false)=>`<div class="avatar" style="--av:${esc(color||'#6875e8')}">${esc(initial||name?.[0]||'?')}${online?'<i class="online-dot"></i>':''}</div>`;
    function renderRail(){ $('#rail').innerHTML=`<button class="server home ${data.view==='friends'?'active':''}" data-action="friends" title="Mensagens e amigos">✦</button><div class="sep"></div>${data.servers.map(s=>`<button class="server ${data.view==='channel'&&data.activeServer===s.id?'active':''}" data-server="${esc(s.id)}" title="${esc(s.name)}">${esc(s.icon||s.name[0])}</button>`).join('')}<button class="server add" data-action="add-server" title="Criar comunidade">+</button>`; }
    function renderSidebar(){ const s=server();$('#sideTitle').textContent=data.view==='friends'?'Mensagens diretas':s?.name||'Comunidade';let html='';
      if(data.view==='friends'){html=`<div class="section-title"><span>AMIGOS</span><button data-action="add-friend" title="Adicionar amigo">＋</button></div><button class="row ${!data.activeDm?'active':''}" data-action="friend-home"><span class="glyph">♙</span><span class="rowname">Todos os amigos</span></button><div class="section-title"><span>MENSAGENS DIRETAS</span><button data-action="add-friend" title="Nova conversa">＋</button></div>${data.friends.map(f=>`<button class="row ${data.activeDm===f.id?'active':''}" data-dm="${esc(f.id)}">${avatar(f.name,f.initial,f.color,f.status==='online')}<span class="rowname">${esc(f.name)}</span></button>`).join('')}`;
      }else if(s){html=s.categories.map(cat=>`<div class="section-title"><span data-collapse="${esc(cat.id)}">${collapsed.has(cat.id)?'›':'⌄'} ${esc(cat.name)}</span><button data-add-category-channel="${esc(cat.id)}" title="Criar canal">＋</button></div>${collapsed.has(cat.id)?'':cat.channels.map(c=>`<button class="row ${data.activeChannel===c.id&&data.view==='channel'?'active':''}" data-channel="${esc(c.id)}" data-type="${c.type}"><span class="glyph">${c.type==='voice'?'◖':'#'}</span><span class="rowname">${esc(c.name)}</span>${c.type==='voice'&&data.joinedVoice===c.id?'<span class="count">ON</span>':''}</button>`).join('')}`).join('')+`<div class="section-title"><span>SUAS CONVERSAS</span><button data-action="add-friend" title="Nova conversa">＋</button></div>${data.friends.slice(0,4).map(f=>`<button class="row" data-action="open-dm" data-dm="${esc(f.id)}">${avatar(f.name,f.initial,f.color,f.status==='online')}<span class="rowname">${esc(f.name)}</span></button>`).join('')}`;}
      $('#sideContent').innerHTML=html;$('#voiceStatus').innerHTML=data.joinedVoice?`<div class="voice-status"><b>● Voz conectada</b><br>${esc(channelName(data.joinedVoice))} · ${esc(server()?.name)}</div><div class="voice-controls"><button class="${data.muted?'on':''}" data-action="mute">${data.muted?'♫̸':'♫'} Mic</button><button class="${data.deafened?'on':''}" data-action="deafen">${data.deafened?'◉̸':'◉'} Áudio</button></div>`:'';$('#profileName').textContent=data.profile.name;$('#profileAvatar').firstChild.textContent=data.profile.name[0]?.toUpperCase()||'V';$('#profileStatus').textContent=data.profile.status; }
    function channelName(id){return server()?.categories.flatMap(c=>c.channels).find(c=>c.id===id)?.name||'Sala de voz'}
    function renderMembers(){const s=server();$('#members').innerHTML=data.view==='friends'?`<h2>Solicitações — ${data.pending.length}</h2>${data.pending.length?data.pending.map((p,i)=>`<div class="member">${avatar(p.name,p.initial,p.color)}<span>${esc(p.name)}</span><button class="iconbtn" data-action="accept-friend" data-index="${i}" title="Aceitar">✓</button></div>`).join(''):'<div class="empty">Sem solicitações</div>'}<h2 style="margin-top:18px">Amigos — ${data.friends.length}</h2>${data.friends.map(f=>`<div class="member">${avatar(f.name,f.initial,f.color,f.status==='online')}<span>${esc(f.name)}</span></div>`).join('')}`:`<h2>Online — ${s?.members.filter(m=>m.status==='online').length||0}</h2>${(s?.members||[]).filter(m=>m.status==='online').map(m=>`<div class="member" title="${esc(m.role)}">${avatar(m.name,m.initial,m.color,true)}<span>${esc(m.name)}</span></div>`).join('')}<h2 style="margin-top:18px">Offline — ${s?.members.filter(m=>m.status!=='online').length||0}</h2>${(s?.members||[]).filter(m=>m.status!=='online').map(m=>`<div class="member offline">${avatar(m.name,m.initial,m.color)}<span>${esc(m.name)}</span></div>`).join('')}`;}
    function messageTarget(){return data.view==='dm'?dm()?.messages:channel()?.messages}
    function renderMessageList(){const title=data.view==='dm'?dm()?.name:channel()?.name;$('#mainTitle').textContent=title||'geral';$('#mainGlyph').textContent=data.view==='dm'?'@':channel()?.type==='voice'?'◖':'#';$('#mainDesc').textContent=data.view==='dm'?'Conversa direta':`Conversa em ${server()?.name||'comunidade'}`;$('#mainContent').innerHTML=`<div class="welcome"><div class="big-hash">${data.view==='dm'?'@':channel()?.type==='voice'?'◖':'#'}</div><h1>${data.view==='dm'?esc(dm()?.name):`Bem-vindo a ${channel()?.type==='voice'?'': '#' }${esc(title||'geral')}`}</h1><p>${data.view==='dm'?'Esta é sua conversa direta.':`Este é o começo de ${esc(title||'geral')}. Diga oi para a comunidade.`}</p></div><div class="date-line">HOJE</div>${(messageTarget()||[]).filter(m=>!filter||m.text.toLowerCase().includes(filter.toLowerCase())).map(m=>`<article class="msg" data-message="${esc(m.id)}">${avatar(m.name,m.initial,m.color)}<div class="body">${m.replyTo?`<div class="replyref">↳ ${esc((messageTarget()||[]).find(x=>x.id===m.replyTo)?.name||'mensagem')} · ${esc((messageTarget()||[]).find(x=>x.id===m.replyTo)?.text||'')}</div>`:''}<div class="meta"><b>${esc(m.name)}</b><time>${esc(m.time)}</time>${m.pinned?'<span title="Fixada">📌</span>':''}</div><p>${esc(m.text)}${m.attachment?`<br><span class="reaction">📎 ${esc(m.attachment.name)} · ${esc(m.attachment.size)}</span>`:''}</p><div class="reactions">${Object.entries(m.reactions||{}).filter(([,v])=>v>0).map(([e,v])=>`<button class="reaction" data-action="react" data-id="${esc(m.id)}" data-emoji="${esc(e)}">${esc(e)} ${v}</button>`).join('')}<button class="reaction" data-action="react" data-id="${esc(m.id)}" data-emoji="👍">＋</button></div></div><div class="msg-actions"><button data-action="reply" data-id="${esc(m.id)}" title="Responder">↩</button><button data-action="react" data-id="${esc(m.id)}" data-emoji="❤️" title="Reagir">♡</button><button data-action="pin" data-id="${esc(m.id)}" title="Fixar">📌</button>${m.name===data.profile.name?`<button data-action="edit" data-id="${esc(m.id)}" title="Editar">✎</button><button data-action="delete" data-id="${esc(m.id)}" title="Excluir">×</button>`:''}</div></article>`).join('')||`<div class="empty">${filter?'Nenhuma mensagem corresponde à busca.':'Ainda não há mensagens. Comece a conversa!'}</div>`}`;$('#mainContent').scrollTop=$('#mainContent').scrollHeight;
      const composer=$('#composerArea');composer.innerHTML=data.view==='channel'&&channel()?.type==='voice'?`<div class="voice-screen"><div><div class="voice-orb">◖</div><h1>${esc(channel().name)}</h1><p>${data.joinedVoice===channel().id?'Você está conectado nesta sala.':'Entre na sala para conversar por voz.'}</p><div class="voice-buttons"><button data-action="mute" title="Microfone">${data.muted?'♫̸':'♫'}</button><button data-action="deafen" title="Áudio">${data.deafened?'◉̸':'◉'}</button><button class="leave" data-action="${data.joinedVoice===channel().id?'leave-voice':'join-voice'}" title="${data.joinedVoice===channel().id?'Sair':'Entrar'}">${data.joinedVoice===channel().id?'☎':'▶'}</button></div></div></div>`:`${replyId?`<div class="reply-banner show">Respondendo a ${esc((messageTarget()||[]).find(m=>m.id===replyId)?.name||'mensagem')}<button data-action="cancel-reply">×</button></div>`:''}${files.length?`<div class="attachment-banner show">📎 ${files.map(f=>esc(f.name)).join(', ')}<button data-action="clear-files">×</button></div>`:''}<form class="composer ${replyId?'replying':''}" id="sendForm"><button type="button" class="iconbtn" data-action="attach" title="Anexar arquivos">＋</button><input id="messageInput" autocomplete="off" placeholder="${data.view==='dm'?`Enviar mensagem para ${esc(dm()?.name||'')}`:`Enviar mensagem em #${esc(channel()?.name||'')}`}" aria-label="Mensagem"><button type="button" class="iconbtn" data-action="emoji" title="Inserir emoji">☺</button><button class="send" type="submit">Enviar</button></form>`;}
    function render(persist=true){if(data.theme==='light')document.body.classList.add('light');else document.body.classList.remove('light');renderRail();renderSidebar();renderMembers();if(data.view==='friends'){ $('#mainTitle').textContent='Amigos';$('#mainGlyph').textContent='♙';$('#mainDesc').textContent='Conecte-se com sua comunidade';$('#mainContent').innerHTML=`<div class="friend-card"><h2>Encontre seus amigos</h2><p>Adicione pessoas pelo nome para iniciar uma conversa direta.</p><div class="friend-tools"><button class="primary" data-action="add-friend">＋ Adicionar amigo</button><span class="secondary">${data.friends.length} amigos</span></div></div><h2 style="font-size:12px;color:var(--muted);margin:18px 4px">TODOS OS AMIGOS — ${data.friends.length}</h2>${data.friends.map(f=>`<div class="friend-item">${avatar(f.name,f.initial,f.color,f.status==='online')}<div class="name"><b>${esc(f.name)}</b><small>${esc(f.status)}</small></div><button class="iconbtn" data-action="open-dm" data-dm="${esc(f.id)}" title="Mensagem">✉</button><button class="iconbtn" data-action="remove-friend" data-id="${esc(f.id)}" title="Remover">×</button></div>`).join('')||'<div class="empty">Adicione alguém para começar.</div>'}`;$('#composerArea').innerHTML='';$('#search').placeholder='⌕ Buscar amigos';}else if(data.view==='dm'||data.view==='channel'){renderMessageList();$('#search').placeholder='⌕ Buscar mensagens';}if(persist)save();}
    function showModal(title,description,fields,submitText,onSubmit){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop"><form class="modal" id="modalForm"><button type="button" class="iconbtn close" data-action="close-modal">×</button><h2>${esc(title)}</h2><p>${esc(description)}</p>${fields}<div class="modal-actions"><button type="button" class="secondary" data-action="close-modal">Cancelar</button><button class="primary" type="submit">${esc(submitText)}</button></div></form></div>`;root.querySelector('#modalForm').addEventListener('submit',e=>{e.preventDefault();onSubmit(root);});root.querySelector('input')?.focus();}
    function addServer(){showModal('Criar comunidade','Dê um nome para sua nova comunidade.','<label>Nome<input name="name" maxlength="40" required placeholder="Minha comunidade"></label>','Criar',root=>{const name=root.querySelector('[name=name]').value.trim();if(!name)return;const s={id:makeId(),name,icon:name[0].toUpperCase(),categories:[{id:makeId(),name:'CANAIS',channels:[{id:makeId(),name:'geral',type:'text',messages:[]},{id:makeId(),name:'Sala de voz',type:'voice',messages:[]}]}],members:[{name:data.profile.name,initial:data.profile.name[0].toUpperCase(),color:'#bf7c96',status:'online',role:'Proprietário'}]};data.servers.push(s);data.activeServer=s.id;data.activeChannel=s.categories[0].channels[0].id;data.view='channel';root.innerHTML='';render();toast('Comunidade criada neste dispositivo.');});}
    function addFriend(){showModal('Adicionar amigo','Use um nome para criar uma conversa local neste protótipo.','<label>Nome de usuário<input name="name" maxlength="40" required placeholder="ex.: alex"></label>','Adicionar',root=>{const name=root.querySelector('[name=name]').value.trim();if(!name)return;const id=makeId();data.friends.push({id,name,initial:name[0].toUpperCase(),color:'#6875e8',status:'offline',messages:[]});data.activeDm=id;data.view='dm';root.innerHTML='';render();toast(`${name} adicionado à lista local.`);});}
    function sendMessage(event){event.preventDefault();const input=$('#messageInput'),text=input?.value.trim();if(!text&&!files.length)return;const arr=messageTarget();if(!arr)return;const attachment=files.length?{name:files.map(f=>f.name).join(', '),size:files.map(f=>formatBytes(f.size)).join(', ')}:null;arr.push({id:makeId(),name:data.profile.name,initial:data.profile.name[0].toUpperCase(),color:'#bf7c96',time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),text:text||'Arquivo anexado',attachment,reactions:{},replyTo:replyId});files=[];replyId=null;filter='';$('#search').value='';render();$('#messageInput')?.focus();}
    function formatBytes(n){if(n<1024)return `${n} B`;if(n<1024*1024)return `${(n/1024).toFixed(0)} KB`;return `${(n/1024/1024).toFixed(1)} MB`;}
    function findMessage(id){return (messageTarget()||[]).find(m=>m.id===id)}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;
      if(b.dataset.server){data.activeServer=b.dataset.server;data.activeChannel=server().categories[0]?.channels[0]?.id;data.view='channel';render();return}
      if(b.dataset.channel){const c=server().categories.flatMap(x=>x.channels).find(x=>x.id===b.dataset.channel);if(c?.type==='voice'){data.activeChannel=c.id;data.view='channel';render();}else{data.activeChannel=b.dataset.channel;data.view='channel';render();}return}
      if(b.dataset.dm){data.activeDm=b.dataset.dm;if(a==='open-dm'||data.view==='friends')data.view='dm';render();return}
      if(b.dataset.collapse){collapsed.has(b.dataset.collapse)?collapsed.delete(b.dataset.collapse):collapsed.add(b.dataset.collapse);render();return}
      if(b.dataset.addCategoryChannel){const category=server().categories.find(c=>c.id===b.dataset.addCategoryChannel);const name=prompt('Nome do novo canal:');if(name?.trim()){const c={id:makeId(),name:name.trim(),type:'text',messages:[]};category.channels.push(c);data.activeChannel=c.id;data.view='channel';render();}return}
      if(a==='friends'||a==='friend-home'){data.view='friends';data.activeDm=null;render();}
      else if(a==='add-server')addServer();else if(a==='add-friend')addFriend();
      else if(a==='open-dm'){data.activeDm=b.dataset.dm;data.view='dm';render();}
      else if(a==='accept-friend'){const p=data.pending.splice(Number(b.dataset.index),1)[0];if(p)data.friends.push({...p,messages:[]});render();}
      else if(a==='remove-friend'){data.friends=data.friends.filter(f=>f.id!==b.dataset.id);if(data.activeDm===b.dataset.id){data.view='friends';data.activeDm=null;}render();}
      else if(a==='invite'){const code=`guild.local/${server()?.id||'friends'}/${Math.random().toString(36).slice(2,8)}`;showModal('Convidar para conversar','Este código é demonstrativo e funciona apenas neste protótipo.',`<label>Convite local<input readonly value="${esc(code)}"></label>`,'Concluído',root=>root.innerHTML='');}
      else if(a==='members'){$('#members').style.display=$('#members').style.display==='none'?'':'none';}
      else if(a==='attach')$('#filePicker').click();else if(a==='emoji'){const i=$('#messageInput');if(i){i.value+=' 😊';i.focus();}}
      else if(a==='clear-files'){files=[];render();}
      else if(a==='cancel-reply'){replyId=null;render();$('#messageInput')?.focus();}
      else if(a==='reply'){replyId=b.dataset.id;render();$('#messageInput')?.focus();}
      else if(a==='react'){const m=findMessage(b.dataset.id);if(m){m.reactions||={};const emoji=b.dataset.emoji||'👍';m.reactions[emoji]=(m.reactions[emoji]||0)+1;render();}}
      else if(a==='pin'){const m=findMessage(b.dataset.id);if(m){m.pinned=!m.pinned;render();toast(m.pinned?'Mensagem fixada localmente.':'Fixação removida.');}}
      else if(a==='edit'){const m=findMessage(b.dataset.id);if(m){const next=prompt('Editar mensagem:',m.text);if(next!==null&&next.trim()){m.text=next.trim();render();}}}
      else if(a==='delete'){const m=findMessage(b.dataset.id);if(m&&confirm('Excluir esta mensagem local?')){const arr=messageTarget();arr.splice(arr.indexOf(m),1);render();}}
      else if(a==='join-voice'){data.joinedVoice=data.activeChannel;data.muted=false;data.deafened=false;render();toast('Conectado à sala neste protótipo.');}
      else if(a==='leave-voice'){data.joinedVoice=null;render();toast('Você saiu da sala.');}
      else if(a==='mute'){data.muted=!data.muted;render();}
      else if(a==='deafen'){data.deafened=!data.deafened;if(data.deafened)data.muted=true;render();}
      else if(a==='logout'){fetch('/api/auth/logout',{method:'POST'}).finally(()=>{stream?.close();stream=null;document.body.classList.remove('authenticated');$('#authScreen').style.display='grid';$('#app').style.display='none';$('#authPassword').value='';$('#authUsername').value='';$('#authError').textContent='';backendReady=false;currentUser=null;data=seed();});}
      else if(a==='profile'){showModal('Seu perfil','Edite o nome que aparece nas mensagens locais.','<label>Nome<input name="name" maxlength="32" required></label>','Salvar',root=>{data.profile.name=root.querySelector('[name=name]').value.trim()||'vita';root.innerHTML='';render();});$('#modalRoot [name=name]').value=data.profile.name;}
      else if(a==='settings'){showModal('Configurações','Preferências salvas neste navegador.',`<label>Nome exibido<input name="name" maxlength="32" value="${esc(data.profile.name)}"></label><label>Tema<select name="theme"><option value="dark" ${data.theme==='dark'?'selected':''}>Escuro</option><option value="light" ${data.theme==='light'?'selected':''}>Claro</option></select></label><label>Status<select name="status"><option ${data.profile.status==='online'?'selected':''}>online</option><option ${data.profile.status==='ausente'?'selected':''}>ausente</option><option ${data.profile.status==='ocupado'?'selected':''}>ocupado</option></select></label>`,'Salvar',root=>{data.profile.name=root.querySelector('[name=name]').value.trim()||'vita';data.profile.status=root.querySelector('[name=status]').value;data.theme=root.querySelector('[name=theme]').value;root.innerHTML='';render();toast('Preferências salvas.');});}
      else if(a==='server-menu'){const name=prompt('Renomear comunidade:',server()?.name);if(name?.trim()){server().name=name.trim();render();}}
      else if(a==='close-modal')$('#modalRoot').innerHTML='';
    });
    document.addEventListener('submit',e=>{if(e.target.id==='sendForm')sendMessage(e)});
    $('#filePicker').addEventListener('change',e=>{files=[...files,...[...e.target.files].map(f=>({name:f.name,size:f.size,type:f.type}))];e.target.value='';render();});
    $('#search').addEventListener('input',e=>{filter=e.target.value.trim();if(data.view==='channel'||data.view==='dm')renderMessageList();else render();});
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}if(e.key==='Escape'&&$('#modalRoot').innerHTML)$('#modalRoot').innerHTML='';});
    let authMode='login', currentUser=null, stream=null;
    const authForm=$('#authForm'), authSwitch=$('#authSwitch');
    authSwitch.addEventListener('click',()=>{authMode=authMode==='login'?'register':'login';$('#authForm h1').textContent=authMode==='login'?'Entrar no Guild':'Criar conta no Guild';$('#authForm p').textContent=authMode==='login'?'Entre para acessar suas conversas privadas.':'Escolha um nome e uma senha forte para sua conta.';authForm.querySelector('button[type=submit]').textContent=authMode==='login'?'Entrar':'Criar conta';authSwitch.textContent=authMode==='login'?'Primeira vez? Criar conta':'Já tem conta? Entrar';$('#authPassword').setAttribute('autocomplete',authMode==='login'?'current-password':'new-password');$('#authError').textContent='';});
    async function startApp(user){currentUser=user;KEY=`guild-app-v1-${user.id}`;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch{data=seed()}data.profile.name=user.username;$('#authScreen').style.display='none';document.body.classList.add('authenticated');const response=await fetch('/api/state');if(!response.ok)throw new Error('Não foi possível carregar seus dados.');const remote=await response.json();if(remote.state)data=remote.state;else{const init=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId,state:data})});if(!init.ok)throw new Error('Não foi possível inicializar seus dados.')}backendReady=true;render(false);stream?.close();stream=new EventSource('/api/events');stream.onmessage=e=>{try{const event=JSON.parse(e.data);if(event.clientId!==clientId&&event.state){data=event.state;localStorage.setItem(KEY,JSON.stringify(data));render(false)}}catch{}};}
    authForm.addEventListener('submit',async e=>{e.preventDefault();const button=authForm.querySelector('button[type=submit]');button.disabled=true;$('#authError').textContent='';try{const response=await fetch(`/api/auth/${authMode==='login'?'login':'register'}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#authUsername').value,password:$('#authPassword').value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Não foi possível entrar.');await startApp(result.user);}catch(error){$('#authError').textContent=error.message;}finally{button.disabled=false;}});
    async function bootstrap(){try{const response=await fetch('/api/auth/me');if(response.ok){const result=await response.json();await startApp(result.user);}}catch(error){$('#authError').textContent='Não foi possível conectar ao servidor Guild.';}}
    bootstrap();
  })();
  </script>
</body>
</html>
